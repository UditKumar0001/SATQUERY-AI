# render.yaml
services:
  - type: web
    name: satquery-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_DEVICE
        value: cpu
      - key: GEMINI_ROUTER_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        value: sqlite:///./satquery.db
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
