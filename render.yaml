# render.yaml
services:
  - type: web
    name: satquery-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MODEL_DEVICE
        value: cpu
      - key: OPENAI_ROUTER_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        value: sqlite:///./satquery.db
      - key: OPENAI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
