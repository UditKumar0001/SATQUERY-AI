# docker-compose.yml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery-backend
    ports:
      - "8000:7860"
    environment:
      - MODEL_DEVICE=cpu
      - DATABASE_URL=sqlite:///./data/satquery.db
      - GEMINI_ROUTER_MODEL=gemini-3.6-flash
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: satquery-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:7860
    depends_on:
      - backend
    restart: unless-stopped
